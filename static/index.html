<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PostingTTII</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;background:#090b0f;color:#f5f7fa}
    main{max-width:1120px;margin:0 auto;padding:18px 16px 48px}
    h1,h2,h3,p{margin-top:0}
    h1{font-size:28px;margin-bottom:3px}
    h2{font-size:17px;margin-bottom:10px}
    .muted{color:#9099a8}.good{color:#69e6a4}.bad{color:#ff8b96}.warn{color:#f6c84f}
    .top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
    .chips{display:flex;gap:7px;flex-wrap:wrap}
    .chip{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border:1px solid #2a323d;border-radius:999px;background:#11161d;font-size:12px}
    .card{background:#12161d;border:1px solid #242b35;border-radius:14px;padding:12px}
    .accountbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
    .platform{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;background:#0d1117;border:1px solid #242c36;border-radius:11px;min-width:0}
    .platform-title{font-weight:800;font-size:13px}
    .account-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
    .acct{font-size:11px;color:#aab3bf;background:#171d25;border:1px solid #2a323e;border-radius:8px;padding:4px 6px}
    button,.btn{border:0;border-radius:9px;padding:8px 10px;cursor:pointer;font-weight:800;text-decoration:none;display:inline-block;font-size:12px}
    button:disabled{opacity:.5;cursor:not-allowed}
    .primary{background:#f5f7fa;color:#090b0f}
    .secondary{background:#242b35;color:#f5f7fa}
    .ghost{background:transparent;color:#cbd3dd;border:1px solid #2b3440}
    .danger{background:#3d1d22;color:#ffbcc3}
    .layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,.7fr);gap:10px}
    .headrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
    .actions{display:flex;gap:6px;flex-wrap:wrap}
    .folder{font-size:11px;color:#798392;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:560px}
    .videos{display:grid;gap:6px;max-height:72vh;overflow:auto;padding-right:2px}
    .video{border:1px solid #252d38;background:#0d1117;border-radius:11px;padding:8px}
    .video.selected{border-color:#596678;background:#101720}
    .video-main{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center}
    .video-check{width:17px;height:17px}
    .video-name{font-size:13px;font-weight:800;word-break:break-word;line-height:1.25}
    .meta{font-size:11px;color:#858f9d;margin-top:2px}
    .history{font-size:11px;color:#69e6a4;margin-top:2px}
    .video-editor{display:none;margin-top:8px;padding-top:8px;border-top:1px solid #242c36}
    .video.selected .video-editor{display:block}
    .airow{display:grid;grid-template-columns:1fr auto;gap:6px;margin-bottom:6px}
    input[type="text"],select,textarea{width:100%;background:#0a0e13;color:#f5f7fa;border:1px solid #2b3440;border-radius:9px;padding:8px 9px;font:inherit}
    input[type="text"],select{font-size:12px}
    textarea{min-height:72px;resize:vertical;font-size:12px;line-height:1.35}
    .ai-status{font-size:11px;color:#8993a2;margin-top:5px}
    .settings{display:grid;gap:9px}
    .label{font-size:11px;color:#8f99a7;margin-bottom:5px}
    .targets{display:grid;gap:5px}
    .target{display:flex;align-items:center;gap:7px;background:#0d1117;border:1px solid #29313c;border-radius:9px;padding:8px}
    .target input{width:16px;height:16px}
    .target b{font-size:12px}.target small{color:#8f99a7}
    .note{font-size:11px;color:#9aa4b2;background:#0d1117;border:1px solid #28313c;border-radius:9px;padding:8px}
    .selected-count{font-size:12px;font-weight:800}
    .queue{margin-top:10px}
    .queue-summary{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
    .stat{font-size:11px;background:#0d1117;border:1px solid #29313c;border-radius:8px;padding:6px 8px}
    .stat b{font-size:12px}
    .jobs{display:grid;gap:6px}
    .job{background:#0d1117;border:1px solid #28313c;border-radius:10px;padding:8px}
    .job-head{display:flex;justify-content:space-between;gap:8px;font-size:12px}
    .progress-line{margin-top:6px}
    .progress-head{display:flex;justify-content:space-between;gap:8px;font-size:10px;color:#9ca6b4}
    .bar{height:6px;background:#252d37;border-radius:999px;overflow:hidden;margin-top:4px}
    .bar>div{height:100%;background:#eef2f7;border-radius:999px;transition:width .35s ease}
    .bar>div.loading{animation:pulse 1s ease-in-out infinite}
    .hidden{display:none!important}
    @keyframes pulse{0%,100%{opacity:.42}50%{opacity:1}}
    @media(max-width:820px){.accountbar,.layout{grid-template-columns:1fr}.videos{max-height:none}.folder{max-width:300px}}
  </style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <h1>PostingTTII</h1>
      <div class="muted" style="font-size:12px">Мультипостинг YouTube + Instagram</div>
    </div>
    <div class="chips">
      <span class="chip">TikTok <span class="bad">OFF</span></span>
      <span class="chip"><span id="selectedCount">0</span> выбрано</span>
    </div>
  </div>

  <section class="accountbar" id="platforms"></section>

  <section class="layout">
    <div class="card">
      <div class="headrow">
        <div>
          <h2 style="margin-bottom:2px">Видео</h2>
          <div class="folder" id="folder"></div>
        </div>
        <div class="actions">
          <button class="ghost" onclick="selectAllVideos()">Все</button>
          <button class="ghost" onclick="clearVideos()">Снять</button>
          <button class="secondary" onclick="load()">↻</button>
        </div>
      </div>
      <div class="videos" id="videos"></div>
    </div>

    <aside class="card">
      <h2>Публикация</h2>
      <div class="settings">
        <div>
          <div class="label">Аккаунты</div>
          <div class="targets" id="batchTargets"></div>
        </div>

        <div>
          <div class="label">Интервал между видео</div>
          <select id="intervalMinutes">
            <option value="15">15 минут</option>
            <option value="20" selected>20 минут</option>
            <option value="30">30 минут</option>
            <option value="45">45 минут</option>
            <option value="60">1 час</option>
            <option value="90">1 ч 30 мин</option>
            <option value="120">2 часа</option>
          </select>
        </div>

        <div class="note" id="cadenceNote">Минимальная пауза будет применяться автоматически.</div>

        <button class="primary" id="startBatch" onclick="startBatch()">▶ Запустить выбранные</button>
      </div>
    </aside>
  </section>

  <section class="card queue hidden" id="queuePanel">
    <div class="headrow">
      <div>
        <h2 style="margin-bottom:2px">Очередь</h2>
        <div class="muted" id="queueSubtitle" style="font-size:11px">Подготавливаю...</div>
      </div>
      <button class="danger" id="cancelBatch" onclick="cancelBatch()">Стоп</button>
    </div>
    <div class="queue-summary">
      <span class="stat">Всего <b id="statTotal">0</b></span>
      <span class="stat">Готово <b id="statDone">0</b></span>
      <span class="stat">Следующее <b id="statNext">—</b></span>
      <span class="stat">Интервал <b id="statInterval">—</b></span>
    </div>
    <div class="jobs" id="jobList"></div>
  </section>
</main>

<script>
let state=null;
let selectedVideos=new Set();
let captions={};
let hints={};
let currentJobId=localStorage.getItem('postingttii_batch_job')||'';
let pollTimer=null;

function esc(s){
  return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function key(s){return encodeURIComponent(s)}
function unkey(s){return decodeURIComponent(s)}

function prettyTarget(target){
  const [platform,slot]=target.split(':');
  return ({youtube:'YouTube',instagram:'Instagram',tiktok:'TikTok'}[platform]||platform)+' #'+slot;
}
function fmtTime(seconds){
  seconds=Math.max(0,Math.floor(Number(seconds)||0));
  const h=Math.floor(seconds/3600),m=Math.floor((seconds%3600)/60),s=seconds%60;
  return h? h+'ч '+m+'м' : m+':'+String(s).padStart(2,'0');
}
function connected(platform,slot){
  return (state.accounts[platform]||[]).find(a=>Number(a.slot)===slot);
}

async function load(){
  const r=await fetch('/api/status');
  state=await r.json();
  document.getElementById('folder').textContent=state.upload_dir;
  const existing=new Set((state.videos||[]).map(v=>v.name));
  selectedVideos=new Set([...selectedVideos].filter(x=>existing.has(x)));
  renderPlatforms();
  renderVideos();
  renderTargets();
  syncIntervalMin();
  updateSelectedCount();
  if(currentJobId)resumeJob(currentJobId);
}

function renderPlatforms(){
  const root=document.getElementById('platforms');
  let html='';
  for(const platform of ['youtube','instagram']){
    const label=platform==='youtube'?'YouTube':'Instagram';
    const accounts=state.accounts[platform]||[];
    html+='<div class="platform"><div><div class="platform-title">'+label+'</div><div class="account-list">';
    for(const slot of [1,2]){
      const a=connected(platform,slot);
      if(a){
        html+='<span class="acct">#'+slot+' '+esc(a.label||'Подключён')+'</span>';
      }else{
        html+='<a class="acct btn" href="/connect/'+platform+'/'+slot+'">+ #'+slot+'</a>';
      }
    }
    html+='</div></div><span class="'+(state.configured[platform]?'good':'bad')+'">'+(state.configured[platform]?'●':'!')+'</span></div>';
  }
  html+='<div class="platform"><div><div class="platform-title">TikTok</div><div class="meta">временно отключён</div></div><span class="bad">OFF</span></div>';
  root.innerHTML=html;
}

function renderVideos(){
  const root=document.getElementById('videos');
  if(!state.videos.length){
    root.innerHTML='<div class="muted" style="font-size:12px;padding:8px">Нет видео в папке.</div>';
    return;
  }

  root.innerHTML=state.videos.map(v=>{
    const selected=selectedVideos.has(v.name);
    const done=v.completed_targets||[];
    const encoded=key(v.name);
    const caption=captions[v.name]||'';
    const hint=hints[v.name]||'';
    return '<div class="video '+(selected?'selected':'')+'">'+
      '<div class="video-main">'+
        '<input class="video-check" type="checkbox" data-name="'+esc(v.name)+'" '+(selected?'checked':'')+' onchange="toggleVideo(this)">'+
        '<div><div class="video-name">'+esc(v.name)+'</div><div class="meta">'+v.size_mb+' MB</div>'+
          (done.length?'<div class="history">Уже: '+done.map(prettyTarget).join(', ')+'</div>':'')+
        '</div>'+
        '<span class="'+(done.length?'good':'muted')+'" style="font-size:11px">'+(done.length?'✓ история':'готов')+'</span>'+
      '</div>'+
      '<div class="video-editor">'+
        '<div class="airow">'+
          '<input id="hint-'+encoded+'" type="text" value="'+esc(hint)+'" placeholder="Контекст для AI: что происходит в ролике?">'+
          '<button class="secondary" id="ai-btn-'+encoded+'" onclick="generateAI(\''+encoded+'\')">✨ AI описание</button>'+
        '</div>'+
        '<textarea id="caption-'+encoded+'" placeholder="Описание + хештеги. Можно написать вручную или нажать AI." oninput="saveCaption(\''+encoded+'\')">'+esc(caption)+'</textarea>'+
        '<div class="ai-status" id="ai-status-'+encoded+'">'+(caption?'Описание готово':'')+'</div>'+
      '</div>'+
    '</div>';
  }).join('');
}

function renderTargets(){
  const root=document.getElementById('batchTargets');
  let html='';
  for(const platform of ['youtube','instagram']){
    for(const a of (state.accounts[platform]||[])){
      const target=platform+':'+a.slot;
      const wait=Number((state.cooldowns||{})[target]||0);
      html+='<label class="target"><input type="checkbox" class="batch-target" value="'+esc(target)+'" checked>'+
        '<span><b>'+prettyTarget(target)+'</b> <small>'+esc(a.label||'')+'</small>'+
        (wait?'<br><small class="warn">пауза '+fmtTime(wait)+'</small>':'')+
        '</span></label>';
    }
  }
  root.innerHTML=html||'<div class="muted" style="font-size:11px">Нет подключённых аккаунтов.</div>';
}

function toggleVideo(el){
  const name=el.dataset.name;
  if(el.checked)selectedVideos.add(name); else selectedVideos.delete(name);
  renderVideos();
  updateSelectedCount();
}
function selectAllVideos(){
  for(const v of state.videos||[])selectedVideos.add(v.name);
  renderVideos(); updateSelectedCount();
}
function clearVideos(){
  selectedVideos.clear();
  renderVideos(); updateSelectedCount();
}
function updateSelectedCount(){
  document.getElementById('selectedCount').textContent=selectedVideos.size;
}

function saveCaption(encoded){
  const name=unkey(encoded);
  captions[name]=document.getElementById('caption-'+encoded)?.value||'';
}
function saveHint(encoded){
  const name=unkey(encoded);
  hints[name]=document.getElementById('hint-'+encoded)?.value||'';
}

async function generateAI(encoded){
  const name=unkey(encoded);
  const btn=document.getElementById('ai-btn-'+encoded);
  const status=document.getElementById('ai-status-'+encoded);
  const hintEl=document.getElementById('hint-'+encoded);
  const captionEl=document.getElementById('caption-'+encoded);
  hints[name]=hintEl?.value||'';

  btn.disabled=true;
  btn.textContent='Генерирую...';
  status.textContent='OpenAI делает описание...';

  try{
    const r=await fetch('/api/caption',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({filename:name,hint:hints[name]})
    });
    const data=await r.json();
    if(!r.ok)throw new Error(data.detail||'Ошибка OpenAI');
    captions[name]=data.caption||'';
    captionEl.value=captions[name];
    status.textContent='✓ Готово. Можно отредактировать.';
    status.className='ai-status good';
  }catch(err){
    status.textContent='Ошибка: '+err.message;
    status.className='ai-status bad';
  }finally{
    btn.disabled=false;
    btn.textContent='✨ AI описание';
  }
}

function syncIntervalMin(){
  const select=document.getElementById('intervalMinutes');
  const min=Math.max(1,Number(state.post_cooldown_minutes||15));
  for(const o of [...select.options])o.disabled=Number(o.value)<min;
  if(Number(select.value)<min){
    const first=[...select.options].find(o=>!o.disabled);
    if(first)select.value=first.value;
  }
  document.getElementById('cadenceNote').textContent=
    'Минимум '+min+' мин. Интервал ограничивает частоту публикаций, но не гарантирует отсутствие ограничений платформ.';
}

async function startBatch(){
  if(!selectedVideos.size){alert('Выбери хотя бы одно видео.');return}
  const targets=[...document.querySelectorAll('.batch-target:checked')].map(x=>x.value);
  if(!targets.length){alert('Выбери хотя бы один аккаунт.');return}

  // Save any text still present in selected editors.
  for(const name of selectedVideos){
    const encoded=key(name);
    const captionEl=document.getElementById('caption-'+encoded);
    const hintEl=document.getElementById('hint-'+encoded);
    if(captionEl)captions[name]=captionEl.value;
    if(hintEl)hints[name]=hintEl.value;
  }

  const btn=document.getElementById('startBatch');
  btn.disabled=true; btn.textContent='Создаю...';

  try{
    const r=await fetch('/api/batch/start',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        filenames:[...selectedVideos],
        targets,
        interval_minutes:Number(document.getElementById('intervalMinutes').value),
        hint:'',
        captions:Object.fromEntries([...selectedVideos].map(name=>[name,(captions[name]||'').trim()]).filter(x=>x[1]))
      })
    });
    const data=await r.json();
    if(!r.ok)throw new Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail));
    currentJobId=data.job_id;
    localStorage.setItem('postingttii_batch_job',currentJobId);
    document.getElementById('queuePanel').classList.remove('hidden');
    await resumeJob(currentJobId);
  }catch(err){
    alert('Не удалось запустить очередь: '+err.message);
  }finally{
    btn.disabled=false; btn.textContent='▶ Запустить выбранные';
  }
}

async function resumeJob(jobId){
  if(pollTimer)clearInterval(pollTimer);
  document.getElementById('queuePanel').classList.remove('hidden');
  const tick=async()=>{
    try{
      const r=await fetch('/api/batch/'+jobId);
      if(r.status===404){
        localStorage.removeItem('postingttii_batch_job');
        currentJobId='';
        clearInterval(pollTimer); pollTimer=null;
        return;
      }
      const job=await r.json();
      renderJob(job);
      if(['done','cancelled','error'].includes(job.status)){
        clearInterval(pollTimer); pollTimer=null;
        await refreshAfterJob();
      }
    }catch(e){}
  };
  await tick();
  pollTimer=setInterval(tick,2000);
}

function targetPercent(status){
  return {queued:0,waiting:14,publishing:62,done:100,already:100,cooldown:14,error:100}[status]??0;
}
function targetText(t){
  if(t.status==='queued')return 'очередь';
  if(t.status==='waiting')return 'пауза '+fmtTime(t.retry_after_seconds||0);
  if(t.status==='publishing')return 'публикация';
  if(t.status==='done')return 'готово';
  if(t.status==='already')return 'уже был';
  if(t.status==='cooldown')return 'пауза '+fmtTime(t.retry_after_seconds||0);
  if(t.status==='error')return t.message||'ошибка';
  return t.message||t.status;
}
function renderJob(job){
  document.getElementById('statTotal').textContent=job.total_videos||0;
  document.getElementById('statDone').textContent=job.completed_videos||0;
  document.getElementById('statInterval').textContent=(job.interval_minutes||0)+'м';

  let next='—';
  if(job.next_video_at)next=fmtTime(Math.max(0,job.next_video_at-Math.floor(Date.now()/1000)));
  else if(job.status==='waiting_account')next='пауза';
  else if(job.status==='running')next='сейчас';
  document.getElementById('statNext').textContent=next;

  const labels={queued:'Создана',running:'Публикую',waiting:'Жду следующий ролик',waiting_account:'Жду аккаунт',done:'Готово',cancelled:'Остановлена',error:'Ошибка'};
  document.getElementById('queueSubtitle').textContent=labels[job.status]||job.status;
  document.getElementById('cancelBatch').disabled=['done','cancelled','error'].includes(job.status);

  document.getElementById('jobList').innerHTML=(job.items||[]).map((item,i)=>{
    let tp='';
    for(const [target,t] of Object.entries(item.targets||{})){
      const pct=targetPercent(t.status);
      tp+='<div class="progress-line"><div class="progress-head"><b>'+prettyTarget(target)+'</b><span>'+esc(targetText(t))+'</span></div>'+
        '<div class="bar"><div class="'+(['publishing','waiting'].includes(t.status)?'loading':'')+'" style="width:'+pct+'%"></div></div></div>';
    }
    const label={queued:'очередь',caption:'AI описание',publishing:'публикую',done:'готово',partial:'частично',error:'ошибка'}[item.status]||item.status;
    return '<div class="job"><div class="job-head"><b>'+(i+1)+'. '+esc(item.filename)+'</b><span class="'+(item.status==='done'?'good':item.status==='error'?'bad':'muted')+'">'+label+'</span></div>'+tp+'</div>';
  }).join('');
}
async function cancelBatch(){
  if(currentJobId)await fetch('/api/batch/'+currentJobId+'/cancel',{method:'POST'});
}
async function refreshAfterJob(){
  const r=await fetch('/api/status');
  state=await r.json();
  renderVideos(); renderTargets();
}
load();
</script>
</body>
</html>
