name: Viral Pro V3 - Fast functional checks
on:
  push:
    branches:
      - "feature/viral-pro-v3-*"
  pull_request:
    paths:
      - "app/viral_reels_pro.py"
      - "static/viral-pro-live.js"
      - "static/viral-reels-pro.html"
      - "tests/test_viral_reels_pro.py"
      - ".github/workflows/viral-pro-v3-fast.yml"

jobs:
  v3:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight test dependencies
        run: |
          python -m pip install -r cloud_render/requirements.txt
          ffmpeg -version | head -1
      - name: Syntax checks
        run: |
          python -m compileall -q app
          node --check static/viral-pro-live.js
          python -c "from pathlib import Path;import re; s=Path('static/viral-reels-pro.html').read_text(encoding='utf-8'); Path('_viral_inline.js').write_text(re.search(r'<script>(.*?)</script>',s,re.S).group(1),encoding='utf-8')"
          node --check _viral_inline.js
      - name: API, captions, and automation unit tests
        run: python -m unittest discover -s tests -p test_viral_reels_pro.py -v
      - name: Real FFmpeg keying and three MP4 variants
        env:
          VIRAL_PRO_TEST_RENDER: "1"
        run: python -m unittest discover -s tests -p test_viral_reels_pro.py -v
