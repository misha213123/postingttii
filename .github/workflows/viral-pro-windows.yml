name: Viral Reels Pro - Windows render tests

on:
  push:
    branches:
      - "feature/viral-pro-integrated-mp4-*"
      - "feature/viral-pro-v3-*"
  pull_request:
    paths:
      - "app/viral_reels_pro.py"
      - "static/viral-reels-pro.html"
      - "tests/test_viral_reels_pro.py"
      - ".github/workflows/viral-pro-windows.yml"
  workflow_dispatch:

jobs:
  viral-pro-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          ffmpeg -version
          ffprobe -version
      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Check Python syntax
        shell: pwsh
        run: python -m compileall -q app
      - name: Check interactive preview JavaScript syntax
        shell: pwsh
        run: |
          node --check static/viral-pro-live.js
          python -c "from pathlib import Path; import re; source=Path('static/viral-reels-pro.html').read_text(encoding='utf-8'); Path('_viral_inline.js').write_text(re.search(r'<script>(.*?)</script>',source,re.S).group(1),encoding='utf-8')"
          node --check _viral_inline.js
      - name: Run unit tests
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_viral_reels_pro.py" -v
      - name: Check existing Telegram circle templates
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_circle*.py" -v
      - name: Check MP4 metadata export regression
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_render_clean_mp4_metadata.py" -v
      - name: Run real FFmpeg render integration test
        shell: pwsh
        run: |
          $env:VIRAL_PRO_TEST_RENDER = "1"
          python -m unittest discover -s tests -p "test_viral_reels_pro.py" -v
